name: Fetch release data

on:
  schedule:
    # Run every 8 hours
    - cron: '0 */8 * * *'
  workflow_dispatch:

concurrency:
  group: fetch-release-data
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  fetch-release-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fetch release data
        run: ./scripts/fetch-releases.sh

      - name: Detect release data changes
        id: changes
        run: |
          if git diff --quiet -- static/data/releases; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Release data is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: lts/jod
          cache: npm

      - name: Validate the generated site
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      - name: Create or update the release data pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: fetch-release-data-update
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          add-paths: static/data/releases/*.json
          commit-message: 'chore(releases): update release data'
          title: 'chore(releases): update release data'
          signoff: true
          sign-commits: true
          body: |
            **What changed?**

            Updated the generated release data for the Cadence service, Go client, and Java client.

            **Why?**

            The release pages use these snapshots to show current and historical GitHub releases.

            **How did you verify it?**

            - Ran `npm ci`.
            - Ran `npm run build`.
            - Source workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            **Potential risks**

            Generated data only. The workflow validates the complete site before updating this pull request.

            **Related changes**

            N/A
