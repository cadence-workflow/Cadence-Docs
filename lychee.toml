# Lychee link checker config.
# Shared by .github/workflows/link-check-pr.yml and link-check-weekly.yml.
# Docs: https://lychee.cli.rs/usage/config/

cache = true
max_cache_age = "1d"
max_retries = 3
retry_wait_time = 2
timeout = 20
max_concurrency = 16

# Treat rate-limit/partial responses as success so transient throttling
# from external sites is not reported as link rot.
accept = [200, 203, 206, 429]

# Skip URLs that routinely 403 bots regardless of how politely we crawl.
# Also skip targets that only appear in old historical blog posts and are
# gone for good (dead DNS, removed repos, past event/webinar pages). We leave
# those posts alone rather than rewriting years-old community spotlights.
exclude = [
  "^http(s)?://localhost",
  "^http(s)?://127\\.0\\.0\\.1",
  "^http(s)?://0\\.0\\.0\\.0",
  "linkedin\\.com",
  "slack\\.com",
  "reddit\\.com",
  "x\\.com",
  "lf\\.biz",
  "stackoverflow\\.com",
  "www\\.uber\\.com",
  "doordash\\.engineering",
  "medium\\.com",
  "levelup\\.gitconnected\\.com",
  "betterprogramming\\.pub",
  "npmjs\\.com",
  "globenewswire\\.com",
  "info\\.instaclustr\\.com",
  "embed\\.emamo\\.com",
  "credativ\\.de",
  "ossna2023\\.sched\\.com",
  "netapp\\.zoom\\.us",
  "developerweek\\.com/global/conference/enterprise",
  "github\\.com/cadence-oss/cadence-notification",
  "instaclustr\\.com/events/",
]

# Never traverse these paths when expanding inputs.
exclude_path = [
  "node_modules",
  ".docusaurus",
  ".preview-pages",
]
