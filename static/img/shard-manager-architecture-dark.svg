<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" width="720" height="452"><title id="sm-arch-title">Shard Manager architecture</title><desc id="sm-arch-desc">Executors and spectators in your application talk only to Shard Manager. Shard Manager keeps all state in etcd, and one instance is elected leader per namespace. Requests from a spectator go directly to the executor that owns the shard, not through Shard Manager.</desc><defs><marker id="sm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d6852"></path></marker><marker id="sm-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb86b"></path></marker></defs><rect x="0.75" y="0.75" width="718.5" height="450.5" rx="10" fill="#221b14" stroke="#3d3227" stroke-width="1.5"></rect><rect x="60" y="28" width="320" height="158" rx="8" fill="#2a2119" stroke="#4a3b2d" stroke-width="1.5"></rect><text x="220" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" letter-spacing="1" fill="#e2cbb0">SHARD MANAGER</text><g><rect x="80" y="66" width="280" height="46" rx="6" fill="#33281e" stroke="#6b5843" stroke-width="1.5"></rect><text x="98" y="95" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffe6cc">Instance 1</text><rect x="228" y="78" width="116" height="22" rx="11" fill="#4a3520"></rect><text x="286" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#ffb86b">leader · ns-a</text></g><g><rect x="80" y="122" width="280" height="46" rx="6" fill="#33281e" stroke="#6b5843" stroke-width="1.5"></rect><text x="98" y="151" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffe6cc">Instance 2</text><rect x="228" y="134" width="116" height="22" rx="11" fill="#4a3520"></rect><text x="286" y="149" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#ffb86b">leader · ns-b</text></g><rect x="470" y="84" width="170" height="76" rx="6" fill="#33281e" stroke="#6b5843" stroke-width="1.5"></rect><text x="555" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffe6cc">etcd</text><text x="555" y="133" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e2cbb0">assignments · leases</text><text x="555" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e2cbb0">leader election</text><line x1="384" y1="121" x2="466" y2="121" stroke="#7d6852" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#sm-arrow)" marker-end="url(#sm-arrow)"></line><text x="425" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2cbb0">state</text><rect x="40" y="270" width="640" height="170" rx="8" fill="#2a2119" stroke="#4a3b2d" stroke-width="1.5" stroke-dasharray="6 4"></rect><text x="360" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" letter-spacing="1" fill="#e2cbb0">YOUR SHARDED APPLICATION</text><rect x="50" y="312" width="190" height="80" rx="6" fill="#33281e" stroke="#6b5843" stroke-width="1.5"></rect><text x="145" y="337" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffe6cc">Executor A</text><text x="145" y="357" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#e2cbb0">shard processors</text><g><rect x="68" y="365" width="46" height="22" rx="4" fill="#2a2119" stroke="#5b4636"></rect><text x="91" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#e2cbb0">s1</text></g><g><rect x="122" y="365" width="46" height="22" rx="4" fill="#2a2119" stroke="#5b4636"></rect><text x="145" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#e2cbb0">s4</text></g><g><rect x="176" y="365" width="46" height="22" rx="4" fill="#2a2119" stroke="#5b4636"></rect><text x="199" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#e2cbb0">s7</text></g><rect x="265" y="312" width="190" height="80" rx="6" fill="#33281e" stroke="#6b5843" stroke-width="1.5"></rect><text x="360" y="337" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffe6cc">Executor B</text><text x="360" y="357" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#e2cbb0">shard processors</text><g><rect x="283" y="365" width="46" height="22" rx="4" fill="#2a2119" stroke="#5b4636"></rect><text x="306" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#e2cbb0">s2</text></g><g><rect x="337" y="365" width="46" height="22" rx="4" fill="#2a2119" stroke="#5b4636"></rect><text x="360" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#e2cbb0">s5</text></g><g><rect x="391" y="365" width="46" height="22" rx="4" fill="#2a2119" stroke="#5b4636"></rect><text x="414" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#e2cbb0">s8</text></g><rect x="480" y="312" width="190" height="80" rx="6" fill="#33281e" stroke="#6b5843" stroke-width="1.5"></rect><text x="575" y="337" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffe6cc">Spectator</text><text x="575" y="357" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#e2cbb0">routes by shard key</text><g><rect x="510" y="365" width="130" height="22" rx="4" fill="#2a2119" stroke="#5b4636"></rect><text x="575" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#e2cbb0">GetShardOwner</text></g><line x1="145" y1="268" x2="150" y2="190" stroke="#7d6852" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#sm-arrow)" marker-end="url(#sm-arrow)"></line><line x1="360" y1="268" x2="260" y2="190" stroke="#7d6852" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#sm-arrow)" marker-end="url(#sm-arrow)"></line><line x1="575" y1="268" x2="350" y2="190" stroke="#7d6852" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#sm-arrow)" marker-end="url(#sm-arrow)"></line><text x="230" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2cbb0">Heartbeat ⇄ assignments</text><text x="502" y="240" text-anchor="start" font-family="system-ui, sans-serif" font-size="13" fill="#e2cbb0">owner lookups · watch stream</text><path d="M 575 392 C 515 442 205 442 145 392" fill="none" stroke="#ffb86b" stroke-width="1.5" marker-end="url(#sm-arrow-accent)"></path><text x="360" y="413" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#ffb86b">requests go straight to the owning host</text></svg>
