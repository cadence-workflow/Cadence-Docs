<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" width="720" height="452"><title id="sm-arch-title">Shard Manager architecture</title><desc id="sm-arch-desc">Executors and spectators in your application talk only to Shard Manager. Shard Manager keeps all state in etcd, and one instance is elected leader per namespace. Requests from a spectator go directly to the executor that owns the shard, not through Shard Manager.</desc><defs><marker id="sm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"></path></marker><marker id="sm-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#276ef1"></path></marker></defs><rect x="0.75" y="0.75" width="718.5" height="450.5" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"></rect><rect x="60" y="28" width="320" height="158" rx="8" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.5"></rect><text x="220" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" letter-spacing="1" fill="#45525f">SHARD MANAGER</text><g><rect x="80" y="66" width="280" height="46" rx="6" fill="#e8eef4" stroke="#94a3b8" stroke-width="1.5"></rect><text x="98" y="95" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1e293b">Instance 1</text><rect x="228" y="78" width="116" height="22" rx="11" fill="#dbeafe"></rect><text x="286" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#276ef1">leader · ns-a</text></g><g><rect x="80" y="122" width="280" height="46" rx="6" fill="#e8eef4" stroke="#94a3b8" stroke-width="1.5"></rect><text x="98" y="151" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1e293b">Instance 2</text><rect x="228" y="134" width="116" height="22" rx="11" fill="#dbeafe"></rect><text x="286" y="149" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#276ef1">leader · ns-b</text></g><rect x="470" y="84" width="170" height="76" rx="6" fill="#e8eef4" stroke="#94a3b8" stroke-width="1.5"></rect><text x="555" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">etcd</text><text x="555" y="133" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#45525f">assignments · leases</text><text x="555" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#45525f">leader election</text><line x1="384" y1="121" x2="466" y2="121" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#sm-arrow)" marker-end="url(#sm-arrow)"></line><text x="425" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#45525f">state</text><rect x="40" y="270" width="640" height="170" rx="8" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"></rect><text x="360" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" letter-spacing="1" fill="#45525f">YOUR SHARDED APPLICATION</text><rect x="50" y="312" width="190" height="80" rx="6" fill="#e8eef4" stroke="#94a3b8" stroke-width="1.5"></rect><text x="145" y="337" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Executor A</text><text x="145" y="357" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#45525f">shard processors</text><g><rect x="68" y="365" width="46" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1"></rect><text x="91" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#45525f">s1</text></g><g><rect x="122" y="365" width="46" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1"></rect><text x="145" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#45525f">s4</text></g><g><rect x="176" y="365" width="46" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1"></rect><text x="199" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#45525f">s7</text></g><rect x="265" y="312" width="190" height="80" rx="6" fill="#e8eef4" stroke="#94a3b8" stroke-width="1.5"></rect><text x="360" y="337" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Executor B</text><text x="360" y="357" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#45525f">shard processors</text><g><rect x="283" y="365" width="46" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1"></rect><text x="306" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#45525f">s2</text></g><g><rect x="337" y="365" width="46" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1"></rect><text x="360" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#45525f">s5</text></g><g><rect x="391" y="365" width="46" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1"></rect><text x="414" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#45525f">s8</text></g><rect x="480" y="312" width="190" height="80" rx="6" fill="#e8eef4" stroke="#94a3b8" stroke-width="1.5"></rect><text x="575" y="337" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Spectator</text><text x="575" y="357" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#45525f">routes by shard key</text><g><rect x="510" y="365" width="130" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1"></rect><text x="575" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#45525f">GetShardOwner</text></g><line x1="145" y1="268" x2="150" y2="190" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#sm-arrow)" marker-end="url(#sm-arrow)"></line><line x1="360" y1="268" x2="260" y2="190" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#sm-arrow)" marker-end="url(#sm-arrow)"></line><line x1="575" y1="268" x2="350" y2="190" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#sm-arrow)" marker-end="url(#sm-arrow)"></line><text x="230" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#45525f">Heartbeat ⇄ assignments</text><text x="502" y="240" text-anchor="start" font-family="system-ui, sans-serif" font-size="13" fill="#45525f">owner lookups · watch stream</text><path d="M 575 392 C 515 442 205 442 145 392" fill="none" stroke="#276ef1" stroke-width="1.5" marker-end="url(#sm-arrow-accent)"></path><text x="360" y="413" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#276ef1">requests go straight to the owning host</text></svg>
